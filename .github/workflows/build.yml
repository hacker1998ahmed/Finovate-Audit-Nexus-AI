name: Build Desktop Application

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest] # Focus on Windows for now as requested
        include:
          - os: windows-latest
            artifact_name: FinovateAudit-Windows

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          # The build script will handle installing requirements-windows.txt
          
      - name: Build Application
        run: python scripts/build_desktop.py

      - name: List dist directory (Debug)
        shell: bash
        run: ls -R dist/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/FinovateAudit/
          if-no-files-found: error
